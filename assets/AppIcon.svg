<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/><stop offset="0.55" stop-color="#7A5CFF"/><stop offset="1" stop-color="#B05CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.62"/><stop offset="1" stop-color="#fff" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2a1a6b" flood-opacity="0.35"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- cửa sổ mờ phía trên: thứ sẽ được thu nhỏ -->
    <g filter="url(#sh)" opacity="0.9">
      <rect x="292" y="178" width="440" height="200" rx="40" fill="url(#glass)" stroke="#fff" stroke-opacity="0.85" stroke-width="6"/>
      <circle cx="340" cy="222" r="13" fill="#FF6159"/><circle cx="382" cy="222" r="13" fill="#FFBD2E"/><circle cx="424" cy="222" r="13" fill="#28C840"/>
    </g>

    <!-- Dock kính -->
    <g filter="url(#sh)">
      <rect x="168" y="440" width="688" height="180" rx="80" fill="url(#glass)" stroke="#fff" stroke-opacity="0.9" stroke-width="7"/>
      <rect x="226" y="486" width="92" height="92" rx="26" fill="#fff" fill-opacity="0.55"/>
      <rect x="342" y="486" width="92" height="92" rx="26" fill="#fff" fill-opacity="0.55"/>
      <rect x="590" y="486" width="92" height="92" rx="26" fill="#fff" fill-opacity="0.55"/>
      <rect x="706" y="486" width="92" height="92" rx="26" fill="#fff" fill-opacity="0.55"/>
    </g>
    <circle cx="512" cy="532" r="130" fill="url(#halo)"/>
    <rect x="458" y="478" width="108" height="108" rx="30" fill="#fff"/>
    <circle cx="512" cy="603" r="7" fill="#fff"/>

    <!-- bóng con trỏ -->
    <path d="M508.0 520.0 L508.0 783.2 L570.1 726.5 L610.6 819.7 L656.5 799.5 L616.0 707.6 L699.7 703.6 Z" fill="#1c1050" opacity="0.45" transform="translate(10 16)" filter="url(#blur)"/>
    <!-- con trỏ -->
    <path d="M508.0 520.0 L508.0 783.2 L570.1 726.5 L610.6 819.7 L656.5 799.5 L616.0 707.6 L699.7 703.6 Z" fill="#fff" stroke="#2b2363" stroke-width="15" stroke-linejoin="round"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
</svg>