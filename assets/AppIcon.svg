<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#B05CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1a6b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- window shrinking toward dock -->
    <g filter="url(#sh)">
      <rect x="282" y="210" width="460" height="320" rx="44" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5"/>
      <rect x="282" y="210" width="460" height="74" rx="44" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="334" cy="247" r="15" fill="#FF6159"/>
      <circle cx="380" cy="247" r="15" fill="#FFBD2E"/>
      <circle cx="426" cy="247" r="15" fill="#28C840"/>
    </g>
    <!-- arrow down -->
    <path d="M512 560 L512 668" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <path d="M456 628 L512 684 L568 628" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dock -->
    <g filter="url(#sh)">
      <rect x="196" y="730" width="632" height="132" rx="48" fill="url(#dock)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
      <rect x="244" y="760" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="352" y="760" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="460" y="752" width="104" height="88" rx="24" fill="#ffffff"/>
      <rect x="600" y="760" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="708" y="760" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.55"/>
    </g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
</svg>
