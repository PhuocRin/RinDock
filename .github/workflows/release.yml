# GitHub tự build RinDock trên máy Mac của GitHub, ký app, và đăng lên Releases:
#   RinDock-X.Y.dmg      file cài cho người tải tay (kèm bản tên cố định RinDock.dmg)
#   RinDock-X.Y.zip      gói cho bộ tự cập nhật trong app
#   RinDock-X.Y.zip.sig  chữ ký ed25519 của gói .zip (app kiểm tra trước khi cài)
# Ra bản mới: repo → Releases → Draft a new release → tag vX.Y → Publish.
# Build thử: tab Actions → Build RinDock → Run workflow (file nằm ở mục Artifacts).
# Cần secret RINDOCK_SIGNING (chứng chỉ ký app + khoá ký gói cập nhật).
name: Build RinDock

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner:
        description: "Máy build (macos-26-intel = Mac Intel, mặc định vì ít kẹt hàng; macos-latest = Mac chip M). Cả hai đều ra app universal."
        default: macos-26-intel
        type: choice
        options: [macos-26-intel, macos-latest]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra trình biên dịch (cần Swift 6.2+ để có Liquid Glass)
        run: |
          uname -m
          swift --version
          swift --version 2>&1 | python3 -c "import re,sys; v=re.search(r'Swift version (\\d+)\\.(\\d+)', sys.stdin.read()); ok=v and (int(v[1]),int(v[2]))>=(6,2); print('Swift', v[1]+'.'+v[2] if v else '?', 'OK' if ok else 'QUÁ CŨ'); sys.exit(0 if ok else 1)"

      - name: Đánh số build (mỗi lần build một số mới, để macOS đọc lại icon)
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Lấy số phiên bản từ tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist

      - name: Chuẩn bị chứng chỉ ký
        env:
          RINDOCK_SIGNING: ${{ secrets.RINDOCK_SIGNING }}
        run: |
          if [ -z "$RINDOCK_SIGNING" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::error::Thiếu secret RINDOCK_SIGNING, không thể phát hành bản chưa ký."
              exit 1
            fi
            echo "::warning::Thiếu secret RINDOCK_SIGNING, build thử sẽ ký ad-hoc."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os
          b = json.loads(base64.b64decode(os.environ["RINDOCK_SIGNING"]))
          tmp = os.environ["RUNNER_TEMP"]
          open(os.path.join(tmp, "sign.p12"), "wb").write(base64.b64decode(b["p12"]))
          # Che giá trị bí mật trong log trước khi đưa vào biến môi trường.
          print("::add-mask::" + b["p12_password"])
          print("::add-mask::" + b["update_key"])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("P12_PASSWORD=" + b["p12_password"] + "\n")
              env.write("UPDATE_KEY=" + b["update_key"] + "\n")
          PY

      - name: Nạp chứng chỉ vào keychain tạm
        run: |
          if [ ! -f "$RUNNER_TEMP/sign.p12" ]; then exit 0; fi
          KC="$RUNNER_TEMP/rindock.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sign.p12"
          HASH="$(security find-certificate -c "Phuoc Rin Code Signing" -Z "$KC" | awk '/SHA-1/ {print $3}')"
          echo "Chứng chỉ: $HASH"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, ký app, tạo .dmg và gói cập nhật
        run: |
          chmod +x build.sh
          ./build.sh release

      - name: Lưu file (để tải khi build thử)
        uses: actions/upload-artifact@v4
        with:
          name: RinDock-build
          path: |
            build/RinDock-*.dmg
            build/RinDock-*.zip
            build/RinDock-*.zip.sig

      - name: Gắn file vào Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Thêm bản tên cố định để link https://github.com/PhuocRin/RinDock/releases/latest/download/RinDock.dmg luôn tải bản mới nhất.
          cp build/RinDock-*.dmg build/RinDock.dmg
          gh release upload "$GITHUB_REF_NAME" build/RinDock-*.dmg build/RinDock.dmg build/RinDock-*.zip build/RinDock-*.zip.sig --clobber

      - name: Xoá keychain tạm
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rindock.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rindock.keychain-db" || true
          fi
