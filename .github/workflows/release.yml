# GitHub tự build RinDock trên máy Mac của GitHub và đăng file .dmg lên Releases.
# Cách ra bản mới: vào trang repo → Releases → Draft a new release → tag dạng v1.0, v1.1… → Publish.
# Hoặc vào tab Actions → Build RinDock → Run workflow để build thử (file nằm ở mục Artifacts).
name: Build RinDock

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lấy số phiên bản từ tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build app và file .dmg
        run: |
          chmod +x build.sh
          ./build.sh dmg

      - name: Lưu file .dmg (để tải khi build thử)
        uses: actions/upload-artifact@v4
        with:
          name: RinDock-dmg
          path: build/RinDock-*.dmg

      - name: Gắn file .dmg vào Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/RinDock-*.dmg --clobber
